name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  assets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run copy-assets
      - run: tar -czf assets.tgz -C public banners banya-.webp ogp.webp favicon.png apple-touch-icon.png discord-logo.png matrix-logo.png misskey-logo.png
      - uses: actions/upload-artifact@v4
        with:
          name: generated-assets
          path: assets.tgz
          retention-days: 1
  build:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: generated-assets
      - run: tar -xzf assets.tgz -C public/ && rm assets.tgz
      # NOTE: npx astro directly to skip prebuild (copy-assets),
      # assets come from the macOS job above
      - run: npx astro check && npx astro build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
